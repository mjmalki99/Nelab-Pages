<!DOCTYPE html>
<html lang="en">
<head>
  <title>Reset Password — Nelab</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="nelab.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><img src="nelab.png" alt="Nelab logo">Nelab</a>
  </header>

  <h1>Ready to reset your password</h1>
  <p class="meta">Yallah Nelab! 🎉</p>
  <p>Tap the button below to set a new password in the Nelab app.</p>
  <a id="openApp" class="btn" href="nelab://reset-password">Open Nelab</a>

  <footer>
    <p class="footnav">
      <a href="index.html">Home</a> ·
      <a href="terms.html">Terms &amp; Conditions</a> ·
      <a href="privacy.html">Privacy Policy</a>
    </p>
    <p class="copyright">© 2026 Nelab. All rights reserved. · <a href="mailto:support@nelab.app">support@nelab.app</a></p>
  </footer>

  <script>
    var params = new URLSearchParams(window.location.search);
    var code = params.get("code") || "";
    if (code) {
      document.getElementById("openApp").href = "nelab://reset-password?code=" + encodeURIComponent(code) + "&type=recovery";
    }
  </script>
</body>
</html>
